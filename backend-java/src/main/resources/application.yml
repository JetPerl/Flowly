server:
  port: 8080

spring:
  application:
    name: flowly-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ilaburnos
    username: ilaburnos
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  liquibase:
    enabled: true
    change-log: db/migration/db.changelog-master.xml
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/flowly

springdoc:
  swagger-ui:
    oauth:
      client-id: ${keycloak.client-id}
      client-secret: ${keycloak.client-secret}

keycloak:
  server-url: http://localhost:8180
  realm: flowly
  client-id: flowly-backend
  client-secret: ${KEYCLOAK_CLIENT_SECRET:uEebnzuo4Ea6FV33blBfvnGFxtudSGMx}

app:
  rest-client:
    connect-timeout: 3s
    read-timeout: 5s